[workspace]
resolver = "3"
members = ["crates/rowdiet-core", "crates/rowdiet", "crates/rowdiet-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Verified by the msrv job in ci.yml; the floor comes from the dependency tree (edition 2024
# alone would allow 1.85).
rust-version = "1.88"
license = "MIT OR Apache-2.0"

# Size-tuned profile for wasm artifacts (wasm/build-wasip1.sh builds with --profile wasm).
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
rowdiet-core = { path = "crates/rowdiet-core", version = "0.1.0", default-features = false }
sqlparser = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

# Lint classes held at zero. ci.sh runs clippy with -D warnings, so anything new here fails the
# build. Deliberately short: pedantic/nursery stay off as whole groups — their remaining
# emissions were judged noise (reasons in the commit that introduced the table).
[workspace.lints.clippy]
# Nursery; currently zero everywhere.
cognitive_complexity = "warn"
assigning_clones = "warn"
explicit_iter_loop = "warn"
needless_pass_by_ref_mut = "warn"
needless_raw_string_hashes = "warn"
or_fun_call = "warn"
ptr_as_ptr = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"
