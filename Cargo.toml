[workspace]
resolver = "2"
members = ["crates/rowdiet-core", "crates/rowdiet"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rowdiet-core = { path = "crates/rowdiet-core", version = "0.1.0" }
sqlparser = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
