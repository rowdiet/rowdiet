[package]
name = "rowdiet"
description = "Postgres column-tetris linter: statically lints migration SQL for alignment-padding waste and suggests a better column order"
keywords = ["postgres", "padding", "alignment", "migration", "lint"]
categories = ["development-tools", "database", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Private for now — flip when shipping to crates.io.
publish = false

[dependencies]
rowdiet-core = { workspace = true, features = ["serde", "fs"] }
clap.workspace = true
serde_json.workspace = true

[features]
# The CLI ships with both parsers so --parser pg-exact works out of the box;
# build with --no-default-features to skip the C compile.
default = ["pg-exact"]
pg-exact = ["rowdiet-core/pg-exact"]

[package.metadata.docs.rs]
# Same feature set as the shipped binary (pg-exact is default), stated explicitly for the docs.rs build.
all-features = true

[lints]
workspace = true
