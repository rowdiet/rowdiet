[package]
name = "rowdiet"
description = "Postgres column-tetris linter: statically lints migration SQL for alignment-padding waste and suggests a better column order"
keywords = ["postgres", "padding", "alignment", "migration", "lint"]
categories = ["development-tools", "database", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
# Private for now — flip when shipping to crates.io.
publish = false

[dependencies]
rowdiet-core = { workspace = true, features = ["serde"] }
clap.workspace = true
serde_json.workspace = true
