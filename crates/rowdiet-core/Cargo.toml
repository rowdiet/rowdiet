[package]
name = "rowdiet-core"
description = "Static analysis of Postgres migration DDL for alignment-padding waste (column tetris): exact fixed-width layout math, labeled varlena bounds, suggested column order"
keywords = ["postgres", "padding", "alignment", "migration", "lint"]
categories = ["development-tools", "database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Private for now — flip when shipping to crates.io.
publish = false

[dependencies]
sqlparser.workspace = true
serde = { workspace = true, optional = true }
# PG17 grammar, native-only (C build); used by the pg-exact backend and the differential oracle.
pg_query = { version = "=6.1.1", optional = true }

[dev-dependencies]
serde_json.workspace = true
proptest = "1"

[features]
default = ["fs"]
fs = []
serde = ["dep:serde"]
pg-exact = ["dep:pg_query"]
