name: ci
on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are cancelled — on a private repo every minute is metered.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASI_SDK: ${{ github.workspace }}/.toolchains/wasi-sdk-33.0-x86_64-linux
    steps:
      - uses: actions/checkout@v4
      - name: rust toolchain + wasm targets
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: cache wasm toolchains
        id: toolchains
        uses: actions/cache@v4
        with:
          path: .toolchains
          key: wasi-sdk-33.0_binaryen-131_x86_64-linux
      - name: install wasi-sdk + binaryen
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p .toolchains
          curl -sSfL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz | tar -xz -C .toolchains
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz | tar -xz -C .toolchains
      - name: install wasmtime, expose tool paths
        run: |
          curl -sSfL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          echo "${{ github.workspace }}/.toolchains/binaryen-version_131/bin" >> "$GITHUB_PATH"
      - name: toolchain sanity — the wasip1 leg must never silently skip
        run: |
          test -x "$WASI_SDK/bin/clang"
          wasmtime --version
          wasm-opt --version
      - name: full verification matrix
        run: ./scripts/ci.sh

  # Every guarantee rowdiet prints rests on measured tuples: check the model's claims against a
  # real PostgreSQL 16 with pageinspect on every push. The full fixture set runs in about a minute.
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: xtask measure against the service container
        env:
          ROWDIET_MEASURE_CONTAINER: ${{ job.services.postgres.id }}
          ROWDIET_MEASURE_PREFIX: ci_
          ROWDIET_MEASURE_REQUIRE: "1"
        run: cargo run -p xtask -- measure

  # Proves the declared rust-version: the workspace must check on the floor toolchain.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88 check --workspace --all-features --locked
