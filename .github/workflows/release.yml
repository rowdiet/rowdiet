name: release
# Publishes rowdiet-core then rowdiet to crates.io on a version tag (or manual dispatch),
# authenticating via Trusted Publishing: the job exchanges its GitHub OIDC identity for a
# short-lived crates.io token, so no long-lived publish token exists anywhere. Both crates
# name this repository + workflow + the release environment as their trusted publisher.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build artifacts for (publish jobs skip already-published versions by failing; use for artifact backfill)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  publish:
    needs: test
    # Tag pushes only: manual dispatches are for artifact backfills, and republishing an
    # existing version can only fail.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # cargo blocks until the published version is visible in the index, so the dependent
      # CLI publish can follow immediately.
      - run: cargo publish -p rowdiet-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: cargo publish -p rowdiet --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Reproducible wasm modules attached to the GitHub release: the pg-exact module the site
  # serves, and the sqlparser-only variant, with checksums. Backfillable for an existing tag
  # via workflow_dispatch.
  artifacts:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      WASI_SDK: ${{ github.workspace }}/.toolchains/wasi-sdk-33.0-x86_64-linux
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: rust toolchain + wasm target
        run: |
          rustup show
          rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: cache wasm toolchains
        id: toolchains
        uses: actions/cache@v4
        with:
          path: .toolchains
          key: wasi-sdk-33.0_binaryen-131_x86_64-linux
      - name: install wasi-sdk + binaryen
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p .toolchains
          curl -sSfL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz | tar -xz -C .toolchains
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz | tar -xz -C .toolchains
      - name: expose wasm-opt
        run: echo "${{ github.workspace }}/.toolchains/binaryen-version_131/bin" >> "$GITHUB_PATH"
      - name: build pg-exact module
        run: |
          ./wasm/build-wasip1.sh
          cp target/wasm32-wasip1/wasm/rowdiet_wasm.wasm "rowdiet-wasm-pgexact-$TAG-wasip1.wasm"
      - name: build sqlparser-only module
        run: |
          ./wasm/build-wasip1.sh --no-default-features
          cp target/wasm32-wasip1/wasm/rowdiet_wasm.wasm "rowdiet-wasm-sqlparser-$TAG-wasip1.wasm"
      - name: checksums + upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum rowdiet-wasm-*-wasip1.wasm > SHA256SUMS
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "rowdiet $TAG"
          gh release upload "$TAG" rowdiet-wasm-*-wasip1.wasm SHA256SUMS --clobber
